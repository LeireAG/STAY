name: stay-python
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyyaml
  - h5py
  - py-opencv
  - matplotlib-base
  - scipy
  - scanpy
  - anndata
  - scikit-image
  - tifffile
  - zarr
  - imagecodecs
  - napari  # annotate_detachment.py (needs a display)
  - pyside6>=6.7  # Qt 6: napari needs Qt >= 6.7 (the conda "pyqt" package is Qt 5)
