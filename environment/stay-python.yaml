name: stay-python
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.18
  - numpy=2.4.6
  - pandas=2.3.3
  - pyyaml=6.0.3
  - h5py=3.16.0
  - py-opencv=4.12.0
  - matplotlib-base=3.11.2
  - scipy=1.17.1
  - scanpy=1.11.5
  - anndata=0.12.19
  - scikit-image=0.26.0
  - tifffile=2025.12.12
  - zarr=3.1.6
  - imagecodecs=2025.8.2
  - panel=1.9.4  # annotate_detachment.py, served to the browser
  - holoviews=1.23.2
  - pip=26.2.1
  - pip:
      # Visium HD tissue_positions.parquet; the pip wheel bundles its own Arrow libraries (the conda package
      # conflicts with py-opencv's dependencies)
      - pyarrow==26.0.0
