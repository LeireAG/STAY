paths:
  sample_list: resources/sample_list.csv
  # {cohort} is filled from the cohort column of sample_list (STAY or standard)
  spaceranger: data/spaceranger/{cohort}
  raw: data/raw_data/{cohort}
  # light images to annotate (prepare_annotation.py), manual annotations (annotate_detachment.py) and the per-spot
  # calls made from them (run_detachment_pipeline.py); the first two are tracked by git
  detachment_annotation_input: data/analysis/{cohort}/detachment_annotation_input
  detachment_annotation: data/analysis/{cohort}/detachment_annotation
  detachment: data/analysis/{cohort}/detachment
  histopathology_annotation: data/histopathology_annotation/{cohort}
  results: results/figure_2

colors:
  cohort:
    STAY: "#FBB4AE"
    standard: "#B3CDE3"
